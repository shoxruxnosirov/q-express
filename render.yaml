# Render Blueprint: one web service serves both the API and the built web app,
# so the browser's relative /api calls need no proxy or CORS setup, and one
# free Postgres instance backs it.
#
# Note: a free Render Postgres expires 30 days after creation. To keep the data
# past that, create a free Neon project (neon.tech) and replace the
# DATABASE_URL value below with its connection string.
databases:
  - name: q-express-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: q-express
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/healthz
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      PORT=5000 BASE_PATH=/ pnpm --filter @workspace/qorasuv-express run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: NODE_ENV
        value: production
      # Resolved against the repository root, which is the start command's
      # working directory.
      - key: CLIENT_DIST_DIR
        value: artifacts/qorasuv-express/dist/public
      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: q-express-db
          property: connectionString
      # Operator login code for /admin, entered once when the blueprint is
      # applied.
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_MODE
        value: legacy
