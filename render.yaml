# Render Blueprint: one web service serves both the API and the built web app,
# so the browser's relative /api calls need no proxy or CORS setup.
#
# The database is a Neon project (neon.tech), not a Render instance: a free
# Render Postgres expires 30 days after it is created, while a free Neon
# project does not. Nothing here provisions it, so DATABASE_URL is set once by
# hand (see below).
services:
  - type: web
    name: q-express
    runtime: node
    autoDeploy: true
    plan: free
    region: frankfurt
    healthCheckPath: /api/healthz
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --frozen-lockfile &&
      PORT=5000 BASE_PATH=/ pnpm --filter @workspace/qorasuv-express run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: NODE_ENV
        value: production
      # Resolved against the repository root, which is the start command's
      # working directory.
      - key: CLIENT_DIST_DIR
        value: artifacts/qorasuv-express/dist/public
      # The Neon connection string, entered in the Render dashboard under
      # q-express > Environment. It is a credential and this repository is
      # public, so it is never written into this file. Prefer the pooled host
      # and sslmode=verify-full; fall back to sslmode=require if the
      # certificate hostname does not verify.
      - key: DATABASE_URL
        sync: false
      # Operator login code for /admin, entered once when the blueprint is
      # applied.
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_MODE
        value: legacy
