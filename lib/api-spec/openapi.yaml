openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Customer catalog operations
  - name: orders
    description: Customer order operations
  - name: admin
    description: Store operations and dashboard
  - name: customer
    description: The customer's own account on this browser
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List active product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [popular, price_asc, price_desc, newest, discount]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the orders placed from this browser
      description: >-
        Only orders created while this browser held the customer cookie. There
        are no accounts, so nothing else identifies the customer; a browser
        without the cookie gets an empty list.
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a grocery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
  /orders/delivery-fee:
    get:
      operationId: getDeliveryFeeEstimate
      tags: [orders]
      summary: Estimate delivery fee for a customer phone number
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            minLength: 7
      responses:
        "200":
          description: Delivery fee estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryFeeEstimate"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order placed from this browser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No such order, or it was placed from another browser
  /customer/me:
    get:
      operationId: getCustomerProfile
      tags: [customer]
      summary: The customer this browser is signed in as, if any
      responses:
        "200":
          description: Profile, or authenticated false with empty fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
    patch:
      operationId: updateCustomerProfile
      tags: [customer]
      summary: Save name and phone, creating the customer on first save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "400":
          description: Invalid phone, or a verified phone cannot be changed here
  /customer/me/addresses:
    put:
      operationId: replaceCustomerAddresses
      tags: [customer]
      summary: Replace the saved delivery addresses, most recent first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressesInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
  /customer/login:
    get:
      operationId: getCustomerLoginLink
      tags: [customer]
      summary: The Telegram link that starts phone verification
      responses:
        "200":
          description: Open it, share the phone number, and the bot sends a code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLoginLink"
        "503":
          description: The Telegram bot is not configured
    post:
      operationId: verifyCustomerLogin
      tags: [customer]
      summary: Verify the phone with the code the bot sent, and sign in
      description: >-
        If the verified phone already belongs to a customer (another device),
        this browser signs in as that customer and brings its orders,
        addresses and chat along.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginInput"
      responses:
        "200":
          description: Verified and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          description: Wrong or expired code
        "429":
          description: Too many attempts
  /customer/telegram:
    post:
      operationId: signInWithTelegram
      tags: [customer]
      summary: Sign in inside the Telegram Mini App
      description: >-
        Takes the Mini App's signed initData. If that Telegram account belongs
        to a verified customer, this webview is signed in as them; otherwise
        nothing changes and authenticated stays false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSignInInput"
      responses:
        "200":
          description: The customer, or authenticated false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          description: initData is not genuine or is too old
  /customer/logout:
    post:
      operationId: customerLogout
      tags: [customer]
      summary: Sign this browser out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Every customer account with their order totals
      responses:
        "200":
          description: Customers, most recent order first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCustomer"
  /admin/auth:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Authenticated operator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong username or password
        "409":
          description: This super admin has not set a password yet; use /admin/setup
        "429":
          description: Too many attempts
  /admin/setup:
    post:
      operationId: adminSetup
      tags: [admin]
      summary: Set a seeded super admin's first password
      description: >-
        Only for a super admin created by migration without a password. Proving
        the deployment's ADMIN_ACCESS_CODE is what authorises it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "200":
          description: Password set and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong access code, or no such account awaiting setup
        "429":
          description: Too many attempts
  /admin/me/password:
    post:
      operationId: changeOwnAdminPassword
      tags: [admin]
      summary: Change the signed-in admin's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordChangeInput"
      responses:
        "200":
          description: Password changed; other sessions are signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Current password wrong or new password too weak
  /admin/me/telegram:
    post:
      operationId: createTelegramLink
      tags: [admin]
      summary: Create a one-time link that connects this admin's Telegram
      responses:
        "201":
          description: Open the link in Telegram and press Start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLink"
        "503":
          description: The Telegram bot is not configured
    delete:
      operationId: unlinkTelegram
      tags: [admin]
      summary: Stop Telegram notifications for this admin
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/admins:
    get:
      operationId: listAdmins
      tags: [admin]
      summary: List every admin account (super admins only)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Not a super admin
    post:
      operationId: createAdmin
      tags: [admin]
      summary: Create an admin with a temporary password (super admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateInput"
      responses:
        "201":
          description: Created; they must change the password on first sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Not a super admin
        "409":
          description: Username taken
  /admin/admins/{id}:
    delete:
      operationId: deleteAdmin
      tags: [admin]
      summary: Delete an admin (super admins only; never the last super admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted and signed out everywhere
        "403":
          description: Not a super admin
        "404":
          description: No such admin
        "409":
          description: That is the last super admin
  /admin/admins/{id}/password:
    post:
      operationId: resetAdminPassword
      tags: [admin]
      summary: Give an admin a new temporary password (super admins only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordResetInput"
      responses:
        "200":
          description: Reset; they must change it on next sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Not a super admin
        "404":
          description: No such admin
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the operator session
      responses:
        "200":
          description: Operator session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out of the operator dashboard
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get store dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List store orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, preparing, courier, delivered, cancelled]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{id}/status:
    patch:
      operationId: updateAdminOrderStatus
      tags: [admin]
      summary: Update an order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
        "409":
          description: That status cannot follow the current one
  /admin/categories:
    post:
      operationId: createAdminCategory
      tags: [admin]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List every product, hidden ones included
      responses:
        "200":
          description: All products with their visibility
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
    post:
      operationId: createAdminProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpdateInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      summary: Delete a product and the image it owns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
  /admin/uploads/signature:
    post:
      operationId: createAdminUploadTicket
      tags: [admin]
      summary: Sign one direct image upload to Cloudinary
      responses:
        "201":
          description: Short-lived credentials for a single upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
  /chat/session:
    post:
      operationId: startChatSession
      tags: [chat]
      summary: Open or resume this browser's conversation
      description: >-
        Idempotent. Returns the existing thread when the browser already holds a
        valid chat cookie, otherwise creates one and sets the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionInput"
      responses:
        "200":
          description: The conversation this browser owns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
  /chat/messages:
    get:
      operationId: getChatTranscript
      tags: [chat]
      summary: Read this browser's conversation
      responses:
        "200":
          description: Every message in the thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTranscript"
        "404":
          description: This browser has no conversation yet
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message as the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The stored message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /admin/chats:
    get:
      operationId: listAdminChats
      tags: [admin]
      summary: List customer conversations, most recent first
      responses:
        "200":
          description: Conversations with their unread counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatThread"
  /admin/chats/{id}/messages:
    get:
      operationId: getAdminChatTranscript
      tags: [admin]
      summary: Read one conversation and mark it seen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Every message in the thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTranscript"
    post:
      operationId: sendAdminChatMessage
      tags: [admin]
      summary: Reply as the operator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The stored message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /store/status:
    get:
      operationId: getStoreStatus
      tags: [orders]
      summary: Whether the shop takes orders now, and the times it can deliver
      responses:
        "200":
          description: Opening hours, open-now, and the bookable delivery slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"
  /admin/store-hours:
    put:
      operationId: updateStoreHours
      tags: [admin]
      summary: Set the opening hours, or pause taking orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreHoursInput"
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"
        "400":
          description: Invalid time
  /leaderboard/weekly:
    get:
      operationId: getWeeklyLeaderboard
      tags: [orders]
      summary: Get the weekly customer leaderboard
      responses:
        "200":
          description: Weekly customer leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyLeaderboardEntry"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, icon, product_count]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        product_count:
          type: integer
    Product:
      type: object
      required: [id, category_id, category, name, description, image_url, price, old_price, unit, stock, is_popular, is_new]
      properties:
        id:
          type: integer
        category_id:
          type: integer
        category:
          type: string
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        price:
          type: number
        old_price:
          type: ["number", "null"]
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
    OrderItem:
      type: object
      required: [product_id, name, image_url, price, quantity, unit, total]
      properties:
        product_id:
          type: integer
        name:
          type: string
        image_url:
          type: string
          format: uri
        price:
          type: number
        quantity:
          type: number
          minimum: 0.001
          multipleOf: 0.000001
        unit:
          type: string
        total:
          type: number
        purchase_mode:
          type: ["string", "null"]
          enum: [quantity, amount, null]
        requested_amount:
          type: ["number", "null"]
          minimum: 0.01
    Order:
      type: object
      required: [id, order_number, customer_name, phone, address, items, status, payment_method, subtotal, delivery_fee, total, created_at]
      properties:
        id:
          type: integer
        order_number:
          type: string
        customer_name:
          type: string
        phone:
          type: string
        address:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          type: string
          enum: [new, preparing, courier, delivered, cancelled]
        payment_method:
          type: string
          enum: [cash, click, payme, uzcard, humo]
        subtotal:
          type: number
        delivery_fee:
          type: number
        total:
          type: number
        created_at:
          type: string
          format: date-time
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: When a pre-order is to be delivered; null for as soon as possible.
        status_changed_by:
          type: string
          nullable: true
          description: Admin who last changed the status. Admin endpoints only.
        status_changed_at:
          type: string
          format: date-time
          nullable: true
          description: When the status last changed. Admin endpoints only.
    OrderInput:
      type: object
      required: [customer_name, items, address, phone, payment_method]
      properties:
        customer_name:
          type: string
          minLength: 2
          maxLength: 80
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id]
            properties:
              product_id:
                type: integer
              quantity:
                type: number
                minimum: 0.001
                multipleOf: 0.001
              purchase_mode:
                type: string
                enum: [quantity, amount]
              amount:
                type: number
                exclusiveMinimum: 0
                multipleOf: 0.01
        address:
          type: string
          minLength: 3
        phone:
          type: string
          minLength: 7
        payment_method:
          type: string
          enum: [cash, click, payme, uzcard, humo]
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: >-
            A delivery slot from StoreStatus.slots for an order placed ahead.
            Omitted or null means as soon as possible, which needs the shop to
            be open now.
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, preparing, courier, delivered, cancelled]
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminSetupInput:
      type: object
      required: [username, access_code, new_password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        access_code:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminPasswordChangeInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminPasswordResetInput:
