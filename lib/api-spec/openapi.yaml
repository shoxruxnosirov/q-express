        username:
          type: string
          pattern: "^[a-z0-9_.-]{3,32}$"
        display_name:
          type: string
          minLength: 2
          maxLength: 60
        role:
          type: string
          enum: [super_admin, admin]
        temporary_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminAccount:
      type: object
      required: [id, username, display_name, role, must_change_password, has_password, telegram_linked, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [super_admin, admin]
        must_change_password:
          type: boolean
        has_password:
          type: boolean
        telegram_linked:
          type: boolean
        created_at:
          type: string
          format: date-time
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        admin:
          $ref: "#/components/schemas/AdminAccount"
    TelegramLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    AdminCategoryInput:
      type: object
      required: [name, slug, icon]
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2
          pattern: "^[a-z0-9-]+$"
        icon:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
    AdminProductInput:
      type: object
      required: [category_id, name, description, image_url, price, unit, stock]
      properties:
        category_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 2
        image_url:
          type: string
          format: uri
        price:
          type: number
          exclusiveMinimum: 0
        old_price:
          type: ["number", "null"]
          minimum: 0
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
        image_public_id:
          type: ["string", "null"]
          minLength: 1
        active:
          type: boolean
    AdminProductUpdateInput:
      type: object
      minProperties: 1
      properties:
        category_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 2
        image_url:
          type: string
          format: uri
        price:
          type: number
          exclusiveMinimum: 0
        old_price:
          type: ["number", "null"]
          minimum: 0
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
        image_public_id:
          type: ["string", "null"]
          minLength: 1
        active:
          type: boolean
    DeliveryFeeEstimate:
      type: object
      required: [delivery_fee, previous_order_count, is_first_order, verification_required]
      properties:
        delivery_fee:
          type: number
        previous_order_count:
          type: integer
        is_first_order:
          type: boolean
        verification_required:
          type: boolean
          description: >-
            True when this would be the phone's first order but the phone is
            not verified on this browser, so the fee applies until it is.
    StoreStatus:
      type: object
      required: [open_now, accepting_orders, open_time, close_time, next_open_at, slots, earliest_accepted_at]
      properties:
        open_now:
          type: boolean
          description: Open by the hours and not paused, so an order for right now is taken.
        accepting_orders:
          type: boolean
          description: False while an admin has paused all orders.
        open_time:
          type: string
          example: "06:00"
        close_time:
          type: string
          example: "23:00"
        next_open_at:
          type: string
          format: date-time
          nullable: true
          description: When the shop next opens, if it is closed now.
        earliest_accepted_at:
          type: string
          format: date-time
          description: >-
            The earliest delivery time an order placed now is still accepted
            for. A slot chosen earlier stays valid until then, even after it
            has dropped off the slot list.
        slots:
          type: array
          description: Delivery times a pre-order may choose, soonest first.
          items:
            type: string
            format: date-time
    StoreHoursInput:
      type: object
      required: [open_time, close_time, accepting_orders]
      properties:
        open_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        close_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        accepting_orders:
          type: boolean
