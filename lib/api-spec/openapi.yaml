openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Customer catalog operations
  - name: orders
    description: Customer order operations
  - name: admin
    description: Store operations and dashboard
  - name: customer
    description: The customer's own account on this browser
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List active product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [popular, price_asc, price_desc, newest, discount]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the orders placed from this browser
      description: >-
        Only orders created while this browser held the customer cookie. There
        are no accounts, so nothing else identifies the customer; a browser
        without the cookie gets an empty list.
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a grocery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
        "403":
          description: >-
            Orders are taken only in the Telegram Mini App (telegram_required),
            or the customer or this device is blocked (blocked).
  /orders/delivery-fee:
    get:
      operationId: getDeliveryFeeEstimate
      tags: [orders]
      summary: Estimate the delivery fee for an address
      description: >-
        The first order to a flat (dom and xonadon) has free delivery, whoever
        places it and from whichever account.
      parameters:
        - name: address
          in: query
          required: true
          description: The address line an order would carry, "12-dom, 5-xonadon".
          schema:
            type: string
            minLength: 3
            maxLength: 200
      responses:
        "200":
          description: Delivery fee estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryFeeEstimate"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order placed from this browser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No such order, or it was placed from another browser
  /orders/{id}/feedback:
    post:
      operationId: sendOrderFeedback
      tags: [orders]
      summary: Send the admins a comment about a delivered order
      description: >-
        Only the customer who placed the order, in the Mini App, once it is
        delivered. The comment is NOT stored: it goes straight to the admins
        through the Telegram bot, with the order and who wrote it. Three
        comments per order a day.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderFeedbackInput"
      responses:
        "200":
          description: The comment reached the admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderFeedbackReceipt"
        "403":
          description: Not in the Mini App (telegram_required), or blocked (blocked)
        "404":
          description: No such order, or not this customer's
        "409":
          description: The order is not delivered yet
        "429":
          description: Too many comments on this order today
        "502":
          description: Telegram did not take it; nothing was kept, so try again
  /customer/me:
    get:
      operationId: getCustomerProfile
      tags: [customer]
      summary: The customer this browser is signed in as, if any
      responses:
        "200":
          description: Profile, or authenticated false with empty fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
    patch:
      operationId: updateCustomerProfile
      tags: [customer]
      summary: Save name and phone, creating the customer on first save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "400":
          description: Invalid phone, or a verified phone cannot be changed here
  /customer/me/addresses:
    put:
      operationId: replaceCustomerAddresses
      tags: [customer]
      summary: Replace the saved delivery addresses, most recent first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressesInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
  /customer/login:
    get:
      operationId: getCustomerLoginLink
      tags: [customer]
      summary: The bot, where the shop opens as the Mini App
      description: >-
        Accounts, the chat and the profile live in Telegram. A browser shows
        this link to send people there.
      responses:
        "200":
          description: The t.me link of the bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLoginLink"
        "503":
          description: The Telegram bot is not configured
  /customer/telegram:
    post:
      operationId: signInWithTelegram
      tags: [customer]
      summary: Sign in inside the Telegram Mini App
      description: >-
        Takes the Mini App's signed initData. The Telegram account is the
        customer: this webview is signed in as its account, which is created
        on first sight. A guest account the webview had before is folded
        in. Called on every launch, so a different Telegram account
        opening the Mini App on the same phone gets its own session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSignInInput"
      responses:
        "200":
          description: The signed-in customer and the session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSession"
        "401":
          description: initData is not genuine or is too old
        "403":
          description: The customer or this device is blocked
  /customer/logout:
    post:
      operationId: customerLogout
      tags: [customer]
      summary: Sign this browser out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Every customer account with their order totals
      responses:
        "200":
          description: Customers, most recent order first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCustomer"
  /admin/customers/{id}/block:
    post:
      operationId: blockCustomer
      tags: [admin]
      summary: Block a customer from ordering, chatting and signing in (super admins only)
      description: >-
        The block follows the customer's phone number and Telegram account
        too, so clearing cookies or switching devices does not lift it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerBlockInput"
      responses:
        "200":
          description: The customer, now blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomer"
        "403":
          description: Not a super admin
        "404":
          description: No such customer
    delete:
      operationId: unblockCustomer
      tags: [admin]
      summary: Lift a customer's block (super admins only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The customer, no longer blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomer"
        "403":
          description: Not a super admin
        "404":
          description: No such customer
  /admin/customers/{id}/sessions:
    get:
      operationId: listCustomerSessions
      tags: [admin]
      summary: The devices a customer is or was signed in on
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sessions, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSession"
  /admin/customer-sessions/{id}/revoke:
    post:
      operationId: revokeCustomerSession
      tags: [admin]
      summary: Sign one of a customer's devices out
      description: >-
        The device's cookie stops working at once. In the Mini App the
        customer is signed in again on the next launch, since Telegram still
        vouches for them; block the device or the customer to keep them out.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The session, now revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "404":
          description: No such session
  /admin/customer-sessions/{id}/block:
    post:
      operationId: blockCustomerSession
      tags: [admin]
      summary: Block one device (super admins only)
      description: >-
        The device keeps its cookie and is refused ordering, chat and profile
        changes. A Mini App session's Telegram account is refused on every
        later launch too. Clearing a browser's cookies escapes a device block;
        block the customer for that.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerBlockInput"
      responses:
        "200":
          description: The session, now blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "403":
          description: Not a super admin
        "404":
          description: No such session
    delete:
      operationId: unblockCustomerSession
      tags: [admin]
      summary: Lift a device block (super admins only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The session, no longer blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "403":
          description: Not a super admin
        "404":
          description: No such session
  /admin/auth:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Authenticated operator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong username or password
        "409":
          description: This super admin has not set a password yet; use /admin/setup
        "429":
          description: Too many attempts
  /admin/setup:
    post:
      operationId: adminSetup
      tags: [admin]
      summary: Set a seeded super admin's first password
      description: >-
        Only for a super admin created by migration without a password. Proving
        the deployment's ADMIN_ACCESS_CODE is what authorises it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "200":
          description: Password set and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong access code, or no such account awaiting setup
        "429":
          description: Too many attempts
  /admin/me/password:
    post:
      operationId: changeOwnAdminPassword
      tags: [admin]
      summary: Change the signed-in admin's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordChangeInput"
      responses:
        "200":
          description: Password changed; other sessions are signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Current password wrong or new password too weak
  /admin/me/telegram:
    post:
      operationId: createTelegramLink
      tags: [admin]
      summary: Create a one-time link that connects this admin's Telegram
      responses:
        "201":
          description: Open the link in Telegram and press Start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLink"
        "503":
          description: The Telegram bot is not configured
    delete:
      operationId: unlinkTelegram
      tags: [admin]
      summary: Stop Telegram notifications for this admin
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/admins:
    get:
      operationId: listAdmins
      tags: [admin]
      summary: List every admin account (super admins only)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Not a super admin
    post:
      operationId: createAdmin
      tags: [admin]
      summary: Create an admin with a temporary password (super admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateInput"
      responses:
        "201":
          description: Created; they must change the password on first sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Not a super admin
        "409":
          description: Username taken
  /admin/admins/{id}:
    delete:
      operationId: deleteAdmin
      tags: [admin]
      summary: Delete an admin (super admins only; never the last super admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted and signed out everywhere
        "403":
          description: Not a super admin
        "404":
          description: No such admin
        "409":
          description: That is the last super admin
  /admin/admins/{id}/password:
    post:
      operationId: resetAdminPassword
      tags: [admin]
      summary: Give an admin a new temporary password (super admins only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordResetInput"
      responses:
        "200":
          description: Reset; they must change it on next sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "403":
          description: Not a super admin
        "404":
          description: No such admin
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the operator session
      responses:
        "200":
          description: Operator session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Sign out of the operator dashboard
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get store dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List store orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, preparing, courier, delivered, cancelled]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{id}/status:
    patch:
      operationId: updateAdminOrderStatus
      tags: [admin]
      summary: Update an order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
        "409":
          description: That status cannot follow the current one
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List every category, hidden ones included
      responses:
        "200":
          description: All categories with their visibility and product count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
    post:
      operationId: createAdminCategory
      tags: [admin]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          description: The name is shorter than two letters once trimmed, or the icon is empty
        "409":
          description: Another category already has this slug or this name
  /admin/categories/{id}:
    patch:
      operationId: updateAdminCategory
      tags: [admin]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryUpdateInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          description: No changes, a name shorter than two letters once trimmed, or an empty icon
        "404":
          description: Category not found
        "409":
          description: Another category already has this slug or this name
    delete:
      operationId: deleteAdminCategory
      tags: [admin]
      summary: Delete an empty category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Category deleted
        "404":
          description: Category not found
        "409":
          description: The category still has products, or it is the last one
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List every product, hidden ones included
      responses:
        "200":
          description: All products with their visibility
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
    post:
      operationId: createAdminProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductUpdateInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      summary: Delete a product and the image it owns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product deleted
  /admin/uploads/signature:
    post:
      operationId: createAdminUploadTicket
      tags: [admin]
      summary: Sign one direct image upload to Cloudinary
      responses:
        "201":
          description: Short-lived credentials for a single upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
  /chat/session:
    post:
      operationId: startChatSession
      tags: [chat]
      summary: Open or resume this browser's conversation
      description: >-
        Idempotent. Returns the existing thread when the browser already holds a
        valid chat cookie, otherwise creates one and sets the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionInput"
      responses:
        "200":
          description: The conversation this browser owns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
  /chat/messages:
    get:
      operationId: getChatTranscript
      tags: [chat]
      summary: Read this browser's conversation
      responses:
        "200":
          description: Every message in the thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTranscript"
        "404":
          description: This browser has no conversation yet
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message as the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The stored message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /admin/chats:
    get:
      operationId: listAdminChats
      tags: [admin]
      summary: List customer conversations, most recent first
      responses:
        "200":
          description: Conversations with their unread counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatThread"
  /admin/chats/{id}:
    delete:
      operationId: deleteAdminChat
      tags: [admin]
      summary: Delete a conversation and every message in it
      description: The customer's next message starts a fresh, empty conversation. A later reply to the deleted one, from the dashboard or Telegram, is answered "not found".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: No such conversation
  /admin/chats/{id}/messages:
    get:
      operationId: getAdminChatTranscript
      tags: [admin]
      summary: Read one conversation and mark it seen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Every message in the thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTranscript"
    post:
      operationId: sendAdminChatMessage
      tags: [admin]
      summary: Reply as the operator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: The stored message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
  /store/status:
    get:
      operationId: getStoreStatus
      tags: [orders]
      summary: Whether the shop takes orders now, and the times it can deliver
      responses:
        "200":
          description: Opening hours, open-now, and the bookable delivery slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"
  /admin/store-hours:
    put:
      operationId: updateStoreHours
      tags: [admin]
      summary: Set the opening hours, or pause taking orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreHoursInput"
      responses:
        "200":
          description: The new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"
        "400":
          description: Invalid time
  /leaderboard/weekly:
    get:
      operationId: getWeeklyLeaderboard
      tags: [orders]
      summary: Get the weekly customer leaderboard
      responses:
        "200":
          description: Weekly customer leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyLeaderboardEntry"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, icon, product_count]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        product_count:
          type: integer
    Product:
      type: object
      required: [id, category_id, category, name, description, image_url, price, old_price, unit, stock, is_popular, is_new]
      properties:
        id:
          type: integer
        category_id:
          type: integer
        category:
          type: string
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        price:
          type: number
        old_price:
          type: ["number", "null"]
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
    OrderItem:
      type: object
      required: [product_id, name, image_url, price, quantity, unit, total]
      properties:
        product_id:
          type: integer
        name:
          type: string
        image_url:
          type: string
          format: uri
        price:
          type: number
        quantity:
          type: number
          minimum: 0.001
          multipleOf: 0.000001
        unit:
          type: string
        total:
          type: number
        purchase_mode:
          type: ["string", "null"]
          enum: [quantity, amount, null]
        requested_amount:
          type: ["number", "null"]
          minimum: 0.01
    Order:
      type: object
      required: [id, order_number, customer_name, phone, address, items, status, payment_method, subtotal, delivery_fee, total, created_at]
      properties:
        id:
          type: integer
        order_number:
          type: string
        customer_name:
          type: string
        phone:
          type: string
        address:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          type: string
          enum: [new, preparing, courier, delivered, cancelled]
        payment_method:
          type: string
          enum: [cash, click, payme, uzcard, humo]
        subtotal:
          type: number
        delivery_fee:
          type: number
        total:
          type: number
        created_at:
          type: string
          format: date-time
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: When a pre-order is to be delivered; null for as soon as possible.
        status_changed_by:
          type: string
          nullable: true
          description: Admin who last changed the status. Admin endpoints only.
        status_changed_at:
          type: string
          format: date-time
          nullable: true
          description: When the status last changed. Admin endpoints only.
        telegram_name:
          type: string
          nullable: true
          description: The ordering customer's name in Telegram. Admin endpoints only.
        telegram_username:
          type: string
          nullable: true
          description: The ordering customer's Telegram @username, without the @. Admin endpoints only.
    OrderInput:
      type: object
      required: [customer_name, items, address, phone, payment_method]
      properties:
        customer_name:
          type: string
          minLength: 2
          maxLength: 80
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id]
            properties:
              product_id:
                type: integer
              quantity:
                type: number
                minimum: 0.001
                multipleOf: 0.001
              purchase_mode:
                type: string
                enum: [quantity, amount]
              amount:
                type: number
                exclusiveMinimum: 0
                multipleOf: 0.01
        address:
          type: string
          minLength: 3
          maxLength: 200
          description: The flat, as "12-dom, 5-xonadon". Capped so every notification about the order fits in one Telegram message.
        phone:
          type: string
          minLength: 7
        payment_method:
          type: string
          enum: [cash, click, payme, uzcard, humo]
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: >-
            A delivery slot from StoreStatus.slots for an order placed ahead.
            Omitted or null means as soon as possible, which needs the shop to
            be open now.
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, preparing, courier, delivered, cancelled]
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminSetupInput:
      type: object
      required: [username, access_code, new_password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        access_code:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminPasswordChangeInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminPasswordResetInput:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminCreateInput:
      type: object
      required: [username, display_name, role, temporary_password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_.-]{3,32}$"
        display_name:
          type: string
          minLength: 2
          maxLength: 60
        role:
          type: string
          enum: [super_admin, admin]
        temporary_password:
          type: string
          minLength: 8
          maxLength: 128
    AdminAccount:
      type: object
      required: [id, username, display_name, role, must_change_password, has_password, telegram_linked, created_at]
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [super_admin, admin]
        must_change_password:
          type: boolean
        has_password:
          type: boolean
        telegram_linked:
          type: boolean
        created_at:
          type: string
          format: date-time
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        admin:
          $ref: "#/components/schemas/AdminAccount"
    TelegramLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    AdminCategoryInput:
      type: object
      required: [name, slug, icon]
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2
          pattern: "^[a-z0-9-]+$"
        icon:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
    AdminCategoryUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        slug:
          type: string
          minLength: 2
          pattern: "^[a-z0-9-]+$"
        icon:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
        active:
          type: boolean
    AdminCategory:
      type: object
      required: [id, name, slug, icon, sort_order, active, product_count]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        sort_order:
          type: integer
        active:
          type: boolean
        product_count:
          type: integer
          description: Every product in the category, hidden ones included
    AdminProductInput:
      type: object
      required: [category_id, name, description, image_url, price, unit, stock]
      properties:
        category_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 2
        image_url:
          type: string
          format: uri
        price:
          type: number
          exclusiveMinimum: 0
        old_price:
          type: ["number", "null"]
          minimum: 0
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
        image_public_id:
          type: ["string", "null"]
          minLength: 1
        active:
          type: boolean
    AdminProductUpdateInput:
      type: object
      minProperties: 1
      properties:
        category_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
        description:
          type: string
          minLength: 2
        image_url:
          type: string
          format: uri
        price:
          type: number
          exclusiveMinimum: 0
        old_price:
          type: ["number", "null"]
          minimum: 0
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
        image_public_id:
          type: ["string", "null"]
          minLength: 1
        active:
          type: boolean
    DeliveryFeeEstimate:
      type: object
      required: [delivery_fee, is_first_order]
      properties:
        delivery_fee:
          type: number
        is_first_order:
          type: boolean
          description: No order has gone to this address yet, so delivery is free.
    StoreStatus:
      type: object
      required: [open_now, accepting_orders, open_time, close_time, next_open_at, slots, earliest_accepted_at]
      properties:
        open_now:
          type: boolean
          description: Open by the hours and not paused, so an order for right now is taken.
        accepting_orders:
          type: boolean
          description: False while an admin has paused all orders.
        open_time:
          type: string
          example: "06:00"
        close_time:
          type: string
          example: "23:00"
        next_open_at:
          type: string
          format: date-time
          nullable: true
          description: When the shop next opens, if it is closed now.
        earliest_accepted_at:
          type: string
          format: date-time
          description: >-
            The earliest delivery time an order placed now is still accepted
            for. A slot chosen earlier stays valid until then, even after it
            has dropped off the slot list.
        slots:
          type: array
          description: Delivery times a pre-order may choose, soonest first.
          items:
            type: string
            format: date-time
    StoreHoursInput:
      type: object
      required: [open_time, close_time, accepting_orders]
      properties:
        open_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        close_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        accepting_orders:
          type: boolean
    DeliveryAddress:
      type: object
      required: [dom, xonadon]
      properties:
        dom:
          type: string
          maxLength: 10
        xonadon:
          type: string
          maxLength: 10
    CustomerProfile:
      type: object
      required: [authenticated, name, phone, phone_verified, telegram_linked, addresses, blocked, chat_open, language]
      properties:
        authenticated:
          type: boolean
        blocked:
          type: boolean
          description: An admin has blocked this customer; ordering, chat and profile changes are refused.
        chat_open:
          type: boolean
          description: The account belongs to a Telegram account, so the chat (shared with the bot) is open. Guests in a browser are sent to Telegram.
        name:
          type: string
        phone:
          type: string
        phone_verified:
          type: boolean
          description: Verified by a code in an earlier build. Nothing verifies phones any more.
        telegram_linked:
          type: boolean
          description: The account belongs to a Telegram account (signed in through the Mini App or the bot).
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAddress"
        language:
          type: ["string", "null"]
          enum: [uz, uz-Cyrl, ru, en, null]
          description: >-
            The language the customer reads the shop in: Uzbek (Latin), Uzbek
            (Cyrillic), Russian or English. Null until known; set from the
            customer's Telegram language when the shop first meets them.
    CustomerProfileInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        phone:
          type: string
          maxLength: 32
        language:
          type: string
          enum: [uz, uz-Cyrl, ru, en]
          description: The language the customer chose for the shop.
    CustomerAddressesInput:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DeliveryAddress"
    TelegramSignInInput:
      type: object
      required: [init_data]
      properties:
        init_data:
          type: string
          minLength: 1
          maxLength: 4096
    TelegramSession:
      type: object
      required: [profile, session_token]
      properties:
        profile:
          $ref: "#/components/schemas/CustomerProfile"
        session_token:
          type: string
          description: >-
            The session's secret, also set as the cookie. The Mini App sends it
            as "Authorization: Bearer <token>" on every request, because a
            webview inside Telegram Web may refuse the cookie of a site in a
            frame.
    OrderFeedbackInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
    OrderFeedbackReceipt:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean
    CustomerLoginLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
    CustomerSession:
      type: object
      required: [id, source, user_agent, created_at, last_seen_at, revoked_at, blocked, blocked_at, blocked_by, block_reason, current]
      properties:
        id:
          type: integer
        source:
          type: string
          enum: [telegram, browser]
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        blocked:
          type: boolean
        blocked_at:
          type: string
          format: date-time
          nullable: true
        blocked_by:
          type: string
          nullable: true
        block_reason:
          type: string
          nullable: true
        current:
          type: boolean
          description: Still usable, neither revoked nor blocked.
    AdminCustomer:
      type: object
      required: [id, name, phone, phone_verified, telegram_linked, telegram_name, telegram_username, active_sessions, blocked_devices, order_count, total_spent, last_order_at, created_at, addresses, blocked, blocked_at, blocked_by, block_reason]
      properties:
        id:
          type: integer
        blocked:
          type: boolean
        blocked_at:
          type: string
          format: date-time
          nullable: true
        blocked_by:
          type: string
          nullable: true
          description: The admin who blocked them.
        block_reason:
          type: string
          nullable: true
        name:
          type: string
        phone:
          type: string
        phone_verified:
          type: boolean
        telegram_linked:
          type: boolean
        telegram_name:
          type: string
          nullable: true
          description: The name Telegram shows for the customer.
        telegram_username:
          type: string
          nullable: true
          description: The customer's Telegram @username, without the @, if they have one.
        active_sessions:
          type: integer
          description: Devices currently signed in (neither revoked nor blocked).
        blocked_devices:
          type: integer
          description: Devices an admin blocked. Any blocked device makes blocked true, since the Telegram account is refused everywhere.
        order_count:
          type: integer
        total_spent:
          type: number
        last_order_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAddress"
    CustomerBlockInput:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
    WeeklyLeaderboardEntry:
      type: object
      required: [rank, customer_name, phone_masked, order_count, is_winner, prize]
      properties:
        rank:
          type: integer
        customer_name:
          type: string
        phone_masked:
          type: string
        order_count:
          type: integer
        is_winner:
          type: boolean
        prize:
          type: ["string", "null"]
    AdminDashboard:
      type: object
      required: [today_orders, new_orders, preparing_orders, courier_orders, delivered_orders, cancelled_orders, today_revenue, weekly_revenue, monthly_revenue, customer_count, product_count, low_stock_count]
      properties:
        today_orders:
          type: integer
        new_orders:
          type: integer
        preparing_orders:
          type: integer
        courier_orders:
          type: integer
        delivered_orders:
          type: integer
        cancelled_orders:
          type: integer
        today_revenue:
          type: number
        weekly_revenue:
          type: number
        monthly_revenue:
          type: number
        customer_count:
          type: integer
        product_count:
          type: integer
        low_stock_count:
          type: integer
    UploadTicket:
      type: object
      required: [cloud_name, api_key, timestamp, folder, signature, expires_in]
      properties:
        cloud_name:
          type: string
        api_key:
          type: string
        timestamp:
          type: integer
        folder:
          type: string
        signature:
          type: string
        expires_in:
          type: integer
    AdminProduct:
      type: object
      required: [id, category_id, category, name, description, image_url, price, old_price, unit, stock, is_popular, is_new, active]
      properties:
        id:
          type: integer
        category_id:
          type: integer
        category:
          type: string
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        price:
          type: number
        old_price:
          type: ["number", "null"]
        unit:
          type: string
          enum: [dona, kg, litr, qadoq]
        stock:
          type: number
          minimum: 0
        is_popular:
          type: boolean
        is_new:
          type: boolean
        active:
          type: boolean
    ChatMessage:
      type: object
      required: [id, sender, body, created_at]
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [customer, operator]
        body:
          type: string
        created_at:
          type: string
          format: date-time
        admin_name:
          type: string
          nullable: true
          description: >-
            Who wrote an operator message. Only present on the admin
            transcript, never shown to customers.
    ChatSession:
      type: object
      required: [thread_id, customer_name, phone]
      properties:
        thread_id:
          type: integer
        customer_name:
          type: string
        phone:
          type: string
    ChatTranscript:
      type: object
      required: [thread_id, messages]
      properties:
        thread_id:
          type: integer
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatSessionInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        phone:
          type: string
          maxLength: 32
    ChatMessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
    AdminChatThread:
      type: object
      required: [id, customer_name, phone, telegram_name, telegram_username, last_message, last_message_at, unread_count, customer_blocked, device_blocked]
      properties:
        id:
          type: integer
        telegram_name:
          type: string
          nullable: true
          description: The name Telegram shows for the customer.
        telegram_username:
          type: string
          nullable: true
          description: The customer's Telegram @username, without the @, if they have one.

        customer_blocked:
          type: boolean
          description: The customer is blocked and cannot read replies.
        device_blocked:
          type: boolean
          description: A device of the customer's Telegram account is blocked, which refuses them everywhere; admins can still answer.
        customer_name:
          type: string
        phone:
          type: string
        last_message:
          type: string
        last_message_at:
          type: string
          format: date-time
        unread_count:
          type: integer
